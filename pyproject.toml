[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-strategy-pipeline"
version = "1.0.0"
description = "Macro event -> strategy P&L prediction pipeline (Apify + Tavily + walk-forward ML)"
requires-python = ">=3.10"
dependencies = ["pandas","numpy","scikit-learn","scipy","matplotlib","pyyaml","python-dotenv","requests","apify-client","yfinance","tzdata"]

[tool.setuptools.packages.find]
where = ["src"]
